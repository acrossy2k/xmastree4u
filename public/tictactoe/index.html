<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ice Cream Tic-Tac-Toe</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
            background-color: #fefae0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        #sprinkleCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .swirl {
            position: absolute;
            width: 40vw;
            height: 40vw;
            min-width: 200px;
            min-height: 200px;
            background: rgba(255, 182, 193, 0.4);
            border-radius: 50%;
            z-index: 0;
            animation: bounceSwirl 8s infinite ease-in-out;
        }
        .swirl1 { top: -5%; left: -5%; animation-delay: 0s; }
        .swirl2 { bottom: -5%; right: -5%; animation-delay: 4s; }

        @keyframes bounceSwirl {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(20px, 30px) scale(1.1); }
        }

        .game-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 90%;
            max-width: 400px;
            padding: 10px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 2.5rem;
            color: #ff007f;
            margin: 0 0 10px 0;
            text-shadow: 2px 2px 0px #fff, 4px 4px 0px #ffb6c1;
            letter-spacing: 1px;
            word-wrap: break-word;
        }

        @media (min-width: 480px) {
            h1 { font-size: 3.5rem; }
        }

        #howToPlayBtn {
            margin-bottom: 15px;
            padding: 8px 16px;
            font-size: 0.9rem;
            background-color: #fb6f92;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 0px #ffb6c1;
            font-family: inherit;
        }
        #howToPlayBtn:hover { background-color: #ff007f; }

        #status {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #4a4a4a;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.8);
            padding: 6px 16px;
            border-radius: 15px;
        }

        /* Fluid, mobile-responsive game grid */
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            background-color: #ddb892;
            background-image: linear-gradient(45deg, #b5835a 25%, transparent 25%), 
                              linear-gradient(-45deg, #b5835a 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #b5835a 75%), 
                              linear-gradient(-45deg, transparent 75%, #b5835a 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
            position: relative;
            z-index: 3;
            width: 100%;
            aspect-ratio: 1 / 1; /* Maintains square ratio across devices */
            box-sizing: border-box;
        }
